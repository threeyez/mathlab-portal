<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLab — Interactive Modules</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="compact">
        <h1>Interactive Learning Modules</h1>
        <a href="index.html" class="back-link">← Back to Portal</a>
    </header>

    <main class="game-grid">
        <!-- Paper.io 2 — embeddable -->
        <div class="game-card">
            <div class="game-frame">
                <iframe src="https://nite.games/embed/paper-io-2" 
                        allow="fullscreen; autoplay; gamepad; pointer-lock" 
                        loading="lazy"></iframe>
            </div>
            <h3>Territory Logic</h3>
            <p>Strategic spatial reasoning exercise.</p>
        </div>

        <!-- FIFA 14 — external link (not iframe-friendly) -->
        <div class="game-card">
            <div class="game-thumb fifa-thumb">
                <span>FIFA 14</span>
            </div>
            <h3>Sports Analytics Lab</h3>
            <p>Physics simulation and probability module.</p>
            <a href="https://ported2browser.org/games/fifa-14/" target="_blank" class="launch-btn">Launch Module</a>
        </div>

        <!-- FIFA 10-13 — via recompiled.games / inxanity -->
        <div class="game-card">
            <div class="game-thumb fifa-thumb">
                <span>FIFA 10–13</span>
            </div>
            <h3>Historical Data Analysis</h3>
            <p>Legacy statistical models and outcomes.</p>
            <a href="https://www.inxanitylabs.com/games/page/3" target="_blank" class="launch-btn">Launch Archive</a>
        </div>
    </main>
</body>
</html>
